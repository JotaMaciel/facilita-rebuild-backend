# Homologacao do Facilita Rebuild (Render Free + Aiven MySQL)
# Selecione a branch feat/persistencia-autenticacao ao criar o Blueprint.
services:
  - type: web
    name: facilita-rebuild-api
    runtime: node
    plan: free
    branch: feat/persistencia-autenticacao
    buildCommand: npm ci --include=dev --no-audit --no-fund && npm run db:generate
    # Somente para a base VAZIA e isolada de homologacao.
    # migrate deploy e idempotente, mas exige permissao DDL no banco.
    startCommand: npm run db:deploy && npm start
    healthCheckPath: /v1/facilita/health
    envVars:
      - key: NODE_ENV
        value: production
      # Um proxy de entrada do Render. Revalidar se adicionar CDN/proxy intermediário.
      - key: TRUST_PROXY_HOPS
        value: "1"
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: DEV_PASSWORD_RESET_LOG
        value: "false"
